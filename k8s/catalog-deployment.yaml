apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  namespace: cb
  labels:
    app: catalog
spec:
  selector:
    app: catalog
  ports:
    - port: 3003
      targetPort: 3003
      protocol: TCP
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-deployment
  namespace: cb
  labels:
    app: catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      restartPolicy: Always
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.35
        command:
        - 'sh'
        - '-c'
        - |
          until nc -zv postgres-service 5432; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
      - name: wait-for-mongodb
        image: busybox:1.35
        command:
        - 'sh'
        - '-c'
        - |
          until nc -zv mongodb-service 27017; do
            echo "Waiting for MongoDB..."
            sleep 2
          done
      - name: wait-for-rabbitmq
        image: busybox:1.35
        command:
        - 'sh'
        - '-c'
        - |
          until nc -zv rabbitmq-service 5672; do
            echo "Waiting for RabbitMQ..."
            sleep 2
          done
      containers:
      - name: catalog
        image: ghcr.io/utland/cinema-api-catalog:1
        command: ["node", "dist/apps/catalog/main"]
        ports:
        - containerPort: 3003
          name: http
        envFrom:
        - configMapRef:
            name: common-config
        - configMapRef:
            name: catalog-config

services:
  booking:
    container_name: booking
    build: 
      context: .
      dockerfile: apps/booking/Dockerfile
      target: development
    command: pnpm run start:dev booking
    env_file:
      - ./apps/booking/.env
    ports:
      - 3001:3001
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - postgres-db
      - rabbitmq
    networks:
      - cinema-network

  identity:
    container_name: identity
    build: 
      context: .
      dockerfile: apps/identity/Dockerfile
      target: development
    command: pnpm run start:dev identity
    env_file:
      - ./apps/identity/.env
    ports:
      - 3002:3002
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - postgres-db
      - rabbitmq
    networks:
      - cinema-network

  catalog:
    container_name: catalog
    build: 
      context: .
      dockerfile: apps/catalog/Dockerfile
      target: development
    command: pnpm run start:dev catalog
    env_file:
      - ./apps/catalog/.env
    ports:
      - 3003:3003
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - postgres-db
      - mongo-db
      - rabbitmq
    networks:
    - cinema-network

  notifications:
    container_name: notifications
    build: 
      context: .
      dockerfile: apps/notifications/Dockerfile
      target: development
    command: pnpm run start:dev notifications
    env_file:
      - ./apps/notifications/.env
    ports:
      - 3004:3004
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - rabbitmq
    networks:
      - cinema-network

  rabbitmq:
    image: rabbitmq:4-management 
    container_name: rabbitmq
    restart: always
    environment:
      - RABBITMQ_DEFAULT_USER=user
      - RABBITMQ_DEFAULT_PASS=password
    ports:
      - "5672:5672"   
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - cinema-network
    

  postgres-db:
    image: postgres:16
    container_name: main-cinema
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cinema-booking
    ports:
      - "5432:5432"
    volumes:
      - main-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cinema-network
  
  mongo-db:
    image: mongo:latest
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    volumes:
      - mongo_data:/data/db
    networks:
      - cinema-network

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - cinema-network
    depends_on:
      - booking
      - catalog
      - identity

networks:
  cinema-network:
    driver: bridge

volumes:
  rabbitmq_data:
  main-db-data:
  mongo_data: